<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #e94560;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modified-badge {
            background: #e94560;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: none;
        }

        .modified-badge.visible {
            display: inline-block;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #ff6b6b;
        }

        .btn-secondary {
            background: #0f3460;
            color: #eee;
        }

        .btn-secondary:hover {
            background: #1a4a7a;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Main Layout */
        .main {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .project-info {
            padding: 16px;
            border-bottom: 1px solid #0f3460;
        }

        .project-info h2 {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .project-info .title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .project-info .meta {
            font-size: 12px;
            color: #666;
        }

        .scene-list {
            padding: 8px;
        }

        .scene-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .scene-item:hover {
            background: #1a3a5c;
        }

        .scene-item.active {
            background: #0f3460;
            border-color: #e94560;
        }

        .scene-item .scene-id {
            font-size: 12px;
            color: #e94560;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .scene-item .scene-text {
            font-size: 13px;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scene-item .scene-meta {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .scene-item .tag {
            background: #0f3460;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Drop Zone */
        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            border: 2px dashed #0f3460;
            border-radius: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .drop-zone-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .drop-zone-text {
            font-size: 18px;
            color: #888;
            margin-bottom: 8px;
        }

        .drop-zone-hint {
            font-size: 14px;
            color: #555;
        }

        /* Scene Detail */
        .scene-detail {
            display: none;
        }

        .scene-detail.visible {
            display: block;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .scene-header h2 {
            font-size: 24px;
            color: #e94560;
        }

        .scene-header .order {
            font-size: 14px;
            color: #666;
        }

        .section {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #0f3460;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #e94560;
        }

        .section-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
        }

        .property {
            display: flex;
            margin-bottom: 12px;
            align-items: flex-start;
        }

        .property:last-child {
            margin-bottom: 0;
        }

        .property-key {
            width: 140px;
            font-size: 13px;
            color: #888;
            flex-shrink: 0;
            padding-top: 8px;
        }

        .property-value {
            flex: 1;
            font-size: 13px;
            color: #eee;
            word-break: break-word;
        }

        /* Form Elements */
        .input-text, .input-textarea, .input-select {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-text:focus, .input-textarea:focus, .input-select:focus {
            outline: none;
            border-color: #e94560;
        }

        .input-textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.5;
        }

        .input-number {
            width: 100px;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
        }

        .input-number:focus {
            outline: none;
            border-color: #e94560;
        }

        .input-color-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-color {
            width: 40px;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        .input-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background: #e94560;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            gap: 4px;
        }

        .tag-remove {
            cursor: pointer;
            opacity: 0.7;
            font-size: 14px;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .tag-input {
            flex: 1;
            min-width: 100px;
            padding: 4px 8px;
            background: transparent;
            border: 1px dashed #1a4a7a;
            border-radius: 4px;
            color: #eee;
            font-size: 11px;
        }

        .tag-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .null-text {
            color: #666;
            font-style: italic;
        }

        /* Lottie Items */
        .lottie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lottie-item {
            background: #0f3460;
            padding: 16px;
            border-radius: 8px;
            position: relative;
        }

        .lottie-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lottie-item-name {
            font-weight: 600;
            color: #e94560;
        }

        .lottie-item-remove {
            color: #666;
            cursor: pointer;
            font-size: 18px;
        }

        .lottie-item-remove:hover {
            color: #e94560;
        }

        .lottie-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #666;
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            background: #0f3460;
            border: 1px dashed #1a4a7a;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .add-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }

        /* Hidden file input */
        #file-input {
            display: none;
        }

        /* Checkbox toggle */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: #0f3460;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle.active {
            background: #e94560;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle.active::after {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Sequence Editor</h1>
        <div class="header-actions">
            <span class="modified-badge" id="modified-badge">Modified</span>
            <button class="btn btn-secondary" id="load-btn">Load JSON</button>
            <button class="btn btn-primary" id="export-btn" disabled>Export JSON</button>
        </div>
    </header>

    <main class="main">
        <aside class="sidebar" id="sidebar">
            <div class="project-info" id="project-info" style="display: none;">
                <h2>Project</h2>
                <div class="title" id="project-title"></div>
                <div class="meta" id="project-meta"></div>
            </div>
            <div class="scene-list" id="scene-list"></div>
        </aside>

        <section class="content" id="content">
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-icon">📁</div>
                <div class="drop-zone-text">Drop Sequence JSON here</div>
                <div class="drop-zone-hint">or click "Load JSON" button</div>
            </div>

            <div class="scene-detail" id="scene-detail"></div>
        </section>
    </main>

    <input type="file" id="file-input" accept=".json">

    <script>
        // Constants
        const VISUAL_TYPES = ['existing_footage', 'motion_graphic_gen', 'image_gen', 'web_render'];
        const CAMERA_MOVEMENTS = ['none', 'zoom_in_slow', 'zoom_out_slow', 'pan_left', 'pan_right', 'shake'];
        const TRANSITIONS = ['cut', 'fade', 'whip_pan_left', 'whip_pan_right', 'dissolve'];
        const TEXT_ANIMATIONS = ['none', 'fade_in', 'fade_in_up', 'slide_in_left', 'slide_in_right', 'bounce', 'typewriter'];
        const TEXT_STYLES = ['bold_impact_white', 'bold_impact_red', 'subtitle_clean'];
        const TEXT_POSITIONS = ['top', 'center', 'bottom'];
        const SYNC_MODES = ['audio', 'visual', 'beat'];
        const LOTTIE_PRESETS = ['success', 'error', 'warning', 'loading'];
        const LOTTIE_POSITIONS = ['top', 'center', 'bottom', 'top-left', 'top-right', 'bottom-left', 'bottom-right'];
        const SFX_PRESETS = ['success', 'error', 'warning', 'loading', 'whoosh', 'click'];
        const VOICE_PRESETS = [
            'chirp_v3_korean_female_confident',
            'chirp_v3_korean_female_cynical', 
            'chirp_v3_korean_female_emphasis',
            'chirp_v3_korean_male_confident'
        ];

        // State
        let sequenceData = null;
        let selectedSceneId = null;
        let isModified = false;

        // DOM Elements
        const dropZone = document.getElementById('drop-zone');
        const sceneDetail = document.getElementById('scene-detail');
        const sceneList = document.getElementById('scene-list');
        const projectInfo = document.getElementById('project-info');
        const fileInput = document.getElementById('file-input');
        const loadBtn = document.getElementById('load-btn');
        const exportBtn = document.getElementById('export-btn');
        const modifiedBadge = document.getElementById('modified-badge');

        // Event Listeners
        loadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        exportBtn.addEventListener('click', exportJSON);

        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.json')) {
                loadFile(file);
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) loadFile(file);
        }

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    sequenceData = JSON.parse(e.target.result);
                    isModified = false;
                    updateModifiedState();
                    renderSequence();
                    exportBtn.disabled = false;
                } catch (err) {
                    alert('Invalid JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function markModified() {
            isModified = true;
            updateModifiedState();
        }

        function updateModifiedState() {
            modifiedBadge.classList.toggle('visible', isModified);
        }

        function renderSequence() {
            if (!sequenceData) return;

            projectInfo.style.display = 'block';
            document.getElementById('project-title').textContent = sequenceData.scenario_meta?.title || sequenceData.project_id;
            document.getElementById('project-meta').textContent = `${sequenceData.scenes?.length || 0} scenes • ${sequenceData.scenario_meta?.aspect_ratio || '9:16'}`;

            renderSceneList();
            dropZone.style.display = 'none';
            
            if (sequenceData.scenes?.length > 0) {
                selectScene(sequenceData.scenes[0].scene_id);
            }
        }

        function renderSceneList() {
            sceneList.innerHTML = '';
            (sequenceData.scenes || []).forEach((scene) => {
                const item = document.createElement('div');
                item.className = 'scene-item' + (scene.scene_id === selectedSceneId ? ' active' : '');
                item.dataset.sceneId = scene.scene_id;

                const textPreview = scene.audio_script?.text?.substring(0, 25) || '';
                const visualType = scene.visual_layer?.type || 'unknown';

                item.innerHTML = `
                    <div class="scene-id">${scene.scene_id}</div>
                    <div class="scene-text">${textPreview}${textPreview.length >= 25 ? '...' : ''}</div>
                    <div class="scene-meta">
                        <span class="tag">${visualType.replace(/_/g, ' ')}</span>
                        ${scene.text_overlay ? '<span class="tag">text</span>' : ''}
                                        ${scene.lottie_overlays?.length ? '<span class="tag">lottie</span>' : ''}
                                        ${scene.sound_effects?.length ? '<span class="tag">sfx</span>' : ''}
                    </div>
                `;

                item.addEventListener('click', () => selectScene(scene.scene_id));
                sceneList.appendChild(item);
            });
        }

        function selectScene(sceneId) {
            selectedSceneId = sceneId;

            document.querySelectorAll('.scene-item').forEach(item => {
                item.classList.toggle('active', item.dataset.sceneId === sceneId);
            });

            const scene = sequenceData.scenes.find(s => s.scene_id === sceneId);
            if (!scene) return;

            renderSceneEditor(scene);
        }

        function getScene() {
            return sequenceData.scenes.find(s => s.scene_id === selectedSceneId);
        }

        function updateScene(path, value) {
            const scene = getScene();
            if (!scene) return;

            const parts = path.split('.');
            let obj = scene;
            for (let i = 0; i < parts.length - 1; i++) {
                if (obj[parts[i]] === undefined) obj[parts[i]] = {};
                obj = obj[parts[i]];
            }
            obj[parts[parts.length - 1]] = value;
            markModified();
            renderSceneList();
        }

        function renderSceneEditor(scene) {
            sceneDetail.classList.add('visible');
            sceneDetail.innerHTML = `
                <div class="scene-header">
                    <h2>${scene.scene_id}</h2>
                    <span class="order">Scene ${scene.sequence_order} of ${sequenceData.scenes.length}</span>
                </div>

                <!-- Audio Script -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Audio Script</span>
                    </div>
                    <div class="property">
                        <span class="property-key">Text</span>
                        <div class="property-value">
                            <textarea class="input-textarea" data-path="audio_script.text">${scene.audio_script?.text || ''}</textarea>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Voice Preset</span>
                        <div class="property-value">
                            <select class="input-select" data-path="audio_script.voice_preset_id">
                                ${VOICE_PRESETS.map(v => `<option value="${v}" ${scene.audio_script?.voice_preset_id === v ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Speed</span>
                        <div class="property-value">
                            <input type="number" class="input-number" data-path="audio_script.speed" 
                                value="${scene.audio_script?.speed || 1.0}" min="0.5" max="2.0" step="0.1">
                        </div>
                    </div>
                </div>

                <!-- Visual Layer -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Visual Layer</span>
                    </div>
                    <div class="property">
                        <span class="property-key">Type</span>
                        <div class="property-value">
                            <select class="input-select" data-path="visual_layer.type">
                                ${VISUAL_TYPES.map(t => `<option value="${t}" ${scene.visual_layer?.type === t ? 'selected' : ''}>${t.replace(/_/g, ' ')}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Query Tags</span>
                        <div class="property-value">
                            <div class="input-tags" id="query-tags">
                                ${(scene.visual_layer?.query_tags || []).map(tag => `
                                    <span class="tag">${tag}<span class="tag-remove" data-tag="${tag}">×</span></span>
                                `).join('')}
                                <input type="text" class="tag-input" placeholder="Add tag..." id="tag-input">
                            </div>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Prompt</span>
                        <div class="property-value">
                            <textarea class="input-textarea" data-path="visual_layer.prompt" placeholder="Visual prompt...">${scene.visual_layer?.prompt || ''}</textarea>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Fallback Prompt</span>
                        <div class="property-value">
                            <textarea class="input-textarea" data-path="visual_layer.fallback_gen_prompt" placeholder="Fallback generation prompt...">${scene.visual_layer?.fallback_gen_prompt || ''}</textarea>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Clip Offset</span>
                        <div class="property-value">
                            <input type="number" class="input-number" data-path="visual_layer.clip_offset" data-nullable="true"
                                value="${scene.visual_layer?.clip_offset ?? ''}" min="0" step="0.1" placeholder="null">
                        </div>
                    </div>
                </div>

                <!-- Text Overlay -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Text Overlay</span>
                        <div class="section-actions">
                            ${scene.text_overlay 
                                ? '<button class="btn btn-small btn-secondary" id="remove-text-overlay">Remove</button>'
                                : '<button class="btn btn-small btn-secondary" id="add-text-overlay">Add</button>'
                            }
                        </div>
                    </div>
                    <div id="text-overlay-fields">
                        ${scene.text_overlay ? renderTextOverlayFields(scene.text_overlay) : '<div class="empty-state">No text overlay</div>'}
                    </div>
                </div>

                <!-- Lottie Overlays -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Lottie Overlays</span>
                        <div class="section-actions">
                            <button class="btn btn-small btn-secondary" id="add-lottie">+ Add Lottie</button>
                        </div>
                    </div>
                    <div class="lottie-list" id="lottie-list">
                        ${(scene.lottie_overlays || []).length ? 
                            scene.lottie_overlays.map((lo, i) => renderLottieItem(lo, i)).join('') :
                            '<div class="empty-state">No lottie overlays</div>'
                        }
                    </div>
                </div>

                <!-- Sound Effects -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Sound Effects</span>
                        <div class="section-actions">
                            <button class="btn btn-small btn-secondary" id="add-sfx">+ Add SFX</button>
                        </div>
                    </div>
                    <div class="lottie-list" id="sfx-list">
                        ${(scene.sound_effects || []).length ? 
                            scene.sound_effects.map((sfx, i) => renderSFXItem(sfx, i)).join('') :
                            '<div class="empty-state">No sound effects</div>'
                        }
                    </div>
                </div>

                <!-- FX Beat -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">FX Beat</span>
                    </div>
                    <div class="property">
                        <span class="property-key">Camera Movement</span>
                        <div class="property-value">
                            <select class="input-select" data-path="fx_beat.camera_movement">
                                ${CAMERA_MOVEMENTS.map(c => `<option value="${c}" ${scene.fx_beat?.camera_movement === c ? 'selected' : ''}>${c.replace(/_/g, ' ')}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Transition Next</span>
                        <div class="property-value">
                            <select class="input-select" data-path="fx_beat.transition_next">
                                ${TRANSITIONS.map(t => `<option value="${t}" ${scene.fx_beat?.transition_next === t ? 'selected' : ''}>${t.replace(/_/g, ' ')}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Effect</span>
                        <div class="property-value">
                            <input type="text" class="input-text" data-path="fx_beat.effect" data-nullable="true"
                                value="${scene.fx_beat?.effect || ''}" placeholder="null">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Beat Timing</span>
                        <div class="property-value">
                            <input type="text" class="input-text" data-path="fx_beat.beat_timing" data-type="array"
                                value="${(scene.fx_beat?.beat_timing || []).join(', ')}" placeholder="e.g., 0.5, 1.2, 2.0">
                        </div>
                    </div>
                </div>

                <!-- Scene Settings -->
                <div class="section">
                    <div class="section-header">
                        <span class="section-title">Scene Settings</span>
                    </div>
                    <div class="property">
                        <span class="property-key">Duration</span>
                        <div class="property-value">
                            <input type="number" class="input-number" data-path="duration" data-nullable="true"
                                value="${scene.duration ?? ''}" min="0" step="0.1" placeholder="null (auto)">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Sync Mode</span>
                        <div class="property-value">
                            <select class="input-select" data-path="sync_mode">
                                ${SYNC_MODES.map(s => `<option value="${s}" ${scene.sync_mode === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-key">Selected Clip ID</span>
                        <div class="property-value">
                            <input type="text" class="input-text" data-path="selected_clip_id" data-nullable="true"
                                value="${scene.selected_clip_id || ''}" placeholder="null">
                        </div>
                    </div>
                </div>
            `;

            attachEventListeners();
        }

        function renderTextOverlayFields(overlay) {
            return `
                <div class="property">
                    <span class="property-key">Content</span>
                    <div class="property-value">
                        <textarea class="input-textarea" data-path="text_overlay.content">${overlay.content || ''}</textarea>
                    </div>
                </div>
                <div class="property">
                    <span class="property-key">Style Template</span>
                    <div class="property-value">
                        <select class="input-select" data-path="text_overlay.style_template">
                            ${TEXT_STYLES.map(s => `<option value="${s}" ${overlay.style_template === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="property">
                    <span class="property-key">Animation</span>
                    <div class="property-value">
                        <select class="input-select" data-path="text_overlay.animation">
                            ${TEXT_ANIMATIONS.map(a => `<option value="${a}" ${overlay.animation === a ? 'selected' : ''}>${a.replace(/_/g, ' ')}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="property">
                    <span class="property-key">Position</span>
                    <div class="property-value">
                        <select class="input-select" data-path="text_overlay.position">
                            ${TEXT_POSITIONS.map(p => `<option value="${p}" ${overlay.position === p ? 'selected' : ''}>${p}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="property">
                    <span class="property-key">Font Color</span>
                    <div class="property-value">
                        <div class="input-color-wrapper">
                            <input type="color" class="input-color" data-path="text_overlay.font_color" data-nullable="true"
                                value="${overlay.font_color || '#ffffff'}">
                            <input type="text" class="input-text" data-path="text_overlay.font_color" data-nullable="true"
                                value="${overlay.font_color || ''}" placeholder="null (use template)">
                        </div>
                    </div>
                </div>
                <div class="property">
                    <span class="property-key">Background Color</span>
                    <div class="property-value">
                        <div class="input-color-wrapper">
                            <input type="color" class="input-color" data-path="text_overlay.background_color" data-nullable="true"
                                value="${overlay.background_color || '#000000'}">
                            <input type="text" class="input-text" data-path="text_overlay.background_color" data-nullable="true"
                                value="${overlay.background_color || ''}" placeholder="null (use template)">
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLottieItem(lo, index) {
            return `
                <div class="lottie-item" data-index="${index}">
                    <div class="lottie-item-header">
                        <span class="lottie-item-name">${lo.lottie_name}</span>
                        <span class="lottie-item-remove" data-index="${index}">×</span>
                    </div>
                    <div class="lottie-grid">
                        <div class="property">
                            <span class="property-key">Name</span>
                            <div class="property-value">
                                <select class="input-select" data-lottie="${index}" data-field="lottie_name">
                                    ${LOTTIE_PRESETS.map(p => `<option value="${p}" ${lo.lottie_name === p ? 'selected' : ''}>${p}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Start Time</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-lottie="${index}" data-field="start_time"
                                    value="${lo.start_time || 0}" min="0" step="0.1">
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Position</span>
                            <div class="property-value">
                                <select class="input-select" data-lottie="${index}" data-field="position">
                                    ${LOTTIE_POSITIONS.map(p => `<option value="${p}" ${lo.position === p ? 'selected' : ''}>${p}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Scale</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-lottie="${index}" data-field="scale"
                                    value="${lo.scale || 0.5}" min="0.1" max="1" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSFXItem(sfx, index) {
            return `
                <div class="lottie-item" data-sfx-index="${index}">
                    <div class="lottie-item-header">
                        <span class="lottie-item-name">${sfx.preset_name}</span>
                        <span class="sfx-item-remove" data-index="${index}">×</span>
                    </div>
                    <div class="lottie-grid">
                        <div class="property">
                            <span class="property-key">Preset</span>
                            <div class="property-value">
                                <select class="input-select" data-sfx="${index}" data-field="preset_name">
                                    ${SFX_PRESETS.map(p => `<option value="${p}" ${sfx.preset_name === p ? 'selected' : ''}>${p}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Volume</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-sfx="${index}" data-field="volume"
                                    value="${sfx.volume ?? 0.5}" min="0" max="1" step="0.1">
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Start Time</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-sfx="${index}" data-field="start_time"
                                    value="${sfx.start_time || 0}" min="0" step="0.1">
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Fade In</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-sfx="${index}" data-field="fade_in"
                                    value="${sfx.fade_in || 0}" min="0" step="0.1">
                            </div>
                        </div>
                        <div class="property">
                            <span class="property-key">Fade Out</span>
                            <div class="property-value">
                                <input type="number" class="input-number" data-sfx="${index}" data-field="fade_out"
                                    value="${sfx.fade_out || 0}" min="0" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            // Generic input handlers
            sceneDetail.querySelectorAll('[data-path]').forEach(el => {
                const event = el.tagName === 'SELECT' ? 'change' : 'input';
                el.addEventListener(event, (e) => {
                    const path = el.dataset.path;
                    let value = el.value;

                    if (el.dataset.nullable === 'true' && value === '') {
                        value = null;
                    } else if (el.type === 'number' && value !== '') {
                        value = parseFloat(value);
                    } else if (el.dataset.type === 'array') {
                        value = value.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
                    }

                    updateScene(path, value);

                    // Sync color inputs
                    if (el.type === 'color') {
                        const textInput = sceneDetail.querySelector(`input[type="text"][data-path="${path}"]`);
                        if (textInput) textInput.value = el.value;
                    } else if (el.type === 'text' && el.dataset.path?.includes('color')) {
                        const colorInput = sceneDetail.querySelector(`input[type="color"][data-path="${path}"]`);
                        if (colorInput && value) colorInput.value = value;
                    }
                });
            });

            // Lottie field handlers
            sceneDetail.querySelectorAll('[data-lottie]').forEach(el => {
                const event = el.tagName === 'SELECT' ? 'change' : 'input';
                el.addEventListener(event, (e) => {
                    const index = parseInt(el.dataset.lottie);
                    const field = el.dataset.field;
                    let value = el.value;

                    if (el.type === 'number') value = parseFloat(value);

                    const scene = getScene();
                    if (scene.lottie_overlays && scene.lottie_overlays[index]) {
                        scene.lottie_overlays[index][field] = value;
                        markModified();
                        renderSceneList();
                        
                        // Update header name if lottie_name changed
                        if (field === 'lottie_name') {
                            const header = el.closest('.lottie-item').querySelector('.lottie-item-name');
                            if (header) header.textContent = value;
                        }
                    }
                });
            });

            // Tag input
            const tagInput = document.getElementById('tag-input');
            if (tagInput) {
                tagInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && tagInput.value.trim()) {
                        e.preventDefault();
                        const scene = getScene();
                        if (!scene.visual_layer.query_tags) scene.visual_layer.query_tags = [];
                        scene.visual_layer.query_tags.push(tagInput.value.trim());
                        markModified();
                        selectScene(selectedSceneId);
                    }
                });
            }

            // Tag remove
            sceneDetail.querySelectorAll('.tag-remove[data-tag]').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    const scene = getScene();
                    scene.visual_layer.query_tags = scene.visual_layer.query_tags.filter(t => t !== tag);
                    markModified();
                    selectScene(selectedSceneId);
                });
            });

            // Add/Remove text overlay
            const addTextOverlay = document.getElementById('add-text-overlay');
            if (addTextOverlay) {
                addTextOverlay.addEventListener('click', () => {
                    const scene = getScene();
                    scene.text_overlay = {
                        content: '',
                        style_template: 'bold_impact_white',
                        animation: 'fade_in',
                        position: 'bottom',
                        font_color: null,
                        background_color: null
                    };
                    markModified();
                    selectScene(selectedSceneId);
                });
            }

            const removeTextOverlay = document.getElementById('remove-text-overlay');
            if (removeTextOverlay) {
                removeTextOverlay.addEventListener('click', () => {
                    const scene = getScene();
                    scene.text_overlay = null;
                    markModified();
                    selectScene(selectedSceneId);
                });
            }

            // Add lottie
            const addLottie = document.getElementById('add-lottie');
            if (addLottie) {
                addLottie.addEventListener('click', () => {
                    const scene = getScene();
                    if (!scene.lottie_overlays) scene.lottie_overlays = [];
                    scene.lottie_overlays.push({
                        lottie_name: 'success',
                        start_time: 0,
                        position: 'center',
                        scale: 0.5
                    });
                    markModified();
                    selectScene(selectedSceneId);
                });
            }

            // Remove lottie
            sceneDetail.querySelectorAll('.lottie-item-remove').forEach(el => {
                el.addEventListener('click', () => {
                    const index = parseInt(el.dataset.index);
                    const scene = getScene();
                    scene.lottie_overlays.splice(index, 1);
                    markModified();
                    selectScene(selectedSceneId);
                });
            });

            // SFX field handlers
            sceneDetail.querySelectorAll('[data-sfx]').forEach(el => {
                const event = el.tagName === 'SELECT' ? 'change' : 'input';
                el.addEventListener(event, (e) => {
                    const index = parseInt(el.dataset.sfx);
                    const field = el.dataset.field;
                    let value = el.value;

                    if (el.type === 'number') value = parseFloat(value);

                    const scene = getScene();
                    if (scene.sound_effects && scene.sound_effects[index]) {
                        scene.sound_effects[index][field] = value;
                        markModified();
                        renderSceneList();
                        
                        if (field === 'preset_name') {
                            const header = el.closest('.lottie-item').querySelector('.lottie-item-name');
                            if (header) header.textContent = value;
                        }
                    }
                });
            });

            // Add SFX
            const addSFX = document.getElementById('add-sfx');
            if (addSFX) {
                addSFX.addEventListener('click', () => {
                    const scene = getScene();
                    if (!scene.sound_effects) scene.sound_effects = [];
                    scene.sound_effects.push({
                        preset_name: 'success',
                        volume: 0.5,
                        start_time: 0,
                        fade_in: 0,
                        fade_out: 0
                    });
                    markModified();
                    selectScene(selectedSceneId);
                });
            }

            // Remove SFX
            sceneDetail.querySelectorAll('.sfx-item-remove').forEach(el => {
                el.addEventListener('click', () => {
                    const index = parseInt(el.dataset.index);
                    const scene = getScene();
                    scene.sound_effects.splice(index, 1);
                    markModified();
                    selectScene(selectedSceneId);
                });
            });
        }

        function exportJSON() {
            if (!sequenceData) return;
            
            const blob = new Blob([JSON.stringify(sequenceData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${sequenceData.project_id || 'sequence'}.json`;
            a.click();
            URL.revokeObjectURL(url);

            isModified = false;
            updateModifiedState();
        }

        // Warn before leaving if modified
        window.addEventListener('beforeunload', (e) => {
            if (isModified) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
