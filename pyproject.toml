[project]
name = "sequence-to-video"
version = "0.1.0"
description = "DDD-based video generation pipeline from sequence planning data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",  # For content_engine LLM client
    "google-cloud-texttospeech>=2.16.0",
    "ffmpeg-python>=0.2.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.25.0",
    "google-cloud-aiplatform>=1.133.0",
    "pillow>=12.1.0",
    "numpy>=2.4.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "google-api-python-client>=2.0.0",  # For YouTube API (optional)
    "youtube-transcript-api>=0.6.0",  # For transcript fetching (optional)
    "boto3>=1.34.0",  # For S3 access (optional)
    "aiohttp>=3.9.0",  # For async HTTP (if not already present)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domains", "infrastructure"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
